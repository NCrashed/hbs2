name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # The image ships Command Line Tools 27 next to Xcode 26.6, and the link
      # step ends up with the CLT's SDK and Xcode's ld, which cannot read the
      # SDK's .tbd stubs ("unknown architecture arm64e.x1"). Pointing both at
      # Xcode did not move the SDK: something on GHC's link path names the CLT
      # one regardless. So use the CLT for the linker too, which reads its own
      # SDK, before ghcup configures GHC against it.
      - name: Use one macOS toolchain, the Command Line Tools
        if: runner.os == 'macOS'
        run: |
          CLT=/Library/Developer/CommandLineTools
          echo "DEVELOPER_DIR=$CLT" >> "$GITHUB_ENV"
          echo "SDKROOT=$CLT/SDKs/MacOSX.sdk" >> "$GITHUB_ENV"
          export DEVELOPER_DIR=$CLT SDKROOT=$CLT/SDKs/MacOSX.sdk
          xcrun --find clang
          xcrun --find ld
          xcrun ld -v 2>&1 | head -1
          readlink "$SDKROOT"

      - name: Set up Haskell toolchain
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.12.1.0'

      # Fails in seconds rather than ten minutes into the dependencies, and
      # says which compiler and linker GHC was configured with.
      - name: Check that GHC can link (macOS)
        if: runner.os == 'macOS'
        run: |
          ghc --info | grep -E '"(C compiler command|C compiler link flags|ld command|ld flags)"'
          cd "$RUNNER_TEMP"
          echo 'main = putStrLn "linked"' > Link.hs
          ghc -v1 -dynamic Link.hs -o link-check
          ./link-check

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libsodium-dev \
            libssl-dev \
            zlib1g-dev \
            libicu-dev \
            libmagic-dev

      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config libsodium openssl@3 icu4c libmagic

      - name: Point cabal at brew library paths (macOS)
        if: runner.os == 'macOS'
        run: |
          cat > cabal.project.local <<EOF
          package *
            extra-include-dirs:
              $(brew --prefix libmagic)/include
              $(brew --prefix openssl@3)/include
              $(brew --prefix icu4c)/include
              $(brew --prefix libsodium)/include
            extra-lib-dirs:
              $(brew --prefix libmagic)/lib
              $(brew --prefix openssl@3)/lib
              $(brew --prefix icu4c)/lib
              $(brew --prefix libsodium)/lib
          EOF
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix icu4c)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "=== cabal.project.local ==="
          cat cabal.project.local
          echo "=== libmagic contents ==="
          ls -la "$(brew --prefix libmagic)/lib" "$(brew --prefix libmagic)/include"

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-ghc-9.6.6-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}-${{ hashFiles('**/*.cabal') }}
          restore-keys: |
            cabal-${{ runner.os }}-ghc-9.6.6-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}-
            cabal-${{ runner.os }}-ghc-9.6.6-

      - name: Update Hackage index
        run: cabal update

      - name: Build dependencies
        run: cabal build all --enable-tests --only-dependencies

      - name: Build
        run: cabal build all --enable-tests

      # Suites are enabled one package at a time. `cabal test all` stays
      # off because the legacy suites have not been audited for the
      # current API and runtime environment; add a package here once its
      # suite is reviewed.
      #
      # hbs2-peer joined for issue #15: the mailbox merge decision now has
      # a regression test, and a regression test nobody runs is not one.
      - name: Test (reviewed suites)
        run: cabal test hbs2-hub hbs2-peer
